<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- connect-src is 'self' while ACCOUNTS_ENABLED is off. Turning the flag on also requires adding the API origin here (same value as WIDS_API_BASE in js/config.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>資料在說什麼？貼上一張表，先看該畫哪張圖</title>
<meta name="description" content="貼上一張表，依資料形狀排出該畫的圖並附理由；69 種都會推薦、9 種可直接畫。分析全部在你的瀏覽器內完成，資料不會離開你的電腦。">
<meta property="og:title" content="資料在說什麼？貼上來，先告訴你該畫哪張圖">
<meta property="og:description" content="貼上一張表，依資料形狀排出該畫的圖並附理由；69 種都會推薦、9 種可直接畫。分析全部在你的瀏覽器內完成，資料不會離開你的電腦。">
<meta property="og:url" content="https://what-is-the-data-saying.vercel.app/">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <h1 data-i18n="title">資料在說什麼？</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </div>
  <div class="header-actions">
    <div class="account" id="accountBar" hidden>
      <p id="planStatus" class="plan-status" role="status" aria-live="polite"></p>
      <button type="button" id="loginBtn" class="btn ghost" hidden>用 GitHub 登入</button>
      <button type="button" id="upgradeBtn" class="btn ghost" hidden>升級</button>
      <button type="button" id="logoutBtn" class="btn ghost" hidden>登出</button>
    </div>
    <button type="button" id="langBtn" class="btn ghost" data-i18n="lang">English</button>
  </div>
</header>

<main class="layout">
  <div class="col-left">
    <section class="card" id="dataCard" aria-labelledby="h-data">
      <h2 id="h-data" data-i18n="step1">1. 資料</h2>
      <div class="data-inputs">
        <label class="field">
          <span data-i18n="sample">載入示範資料</span>
          <select id="sampleSelect"></select>
        </label>
        <label class="field">
          <span data-i18n="upload">上傳 CSV、Excel、JSON</span>
          <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.ods,.json,text/csv,application/json,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.spreadsheet">
        </label>
        <label class="field" id="sheetField" hidden>
          <span data-i18n="sheet">工作表</span>
          <select id="sheetSelect"></select>
        </label>
      </div>
      <details id="pasteBox">
        <summary data-i18n="paste">或貼上 CSV／JSON 文字</summary>
        <textarea id="pasteArea" rows="6" spellcheck="false" placeholder="date,category,value&#10;2024-01,A,12"></textarea>
        <button type="button" id="parseBtn" class="btn" data-i18n="parse">解析貼上的文字</button>
      </details>
      <p id="dataStatus" class="status" role="status" aria-live="polite"></p>
      <div id="preview" class="table-wrap"></div>
    </section>

    <section class="card" id="colCard" aria-labelledby="h-cols">
      <h2 id="h-cols" data-i18n="step2">2. 欄位型態</h2>
      <div id="columns" class="table-wrap"></div>
    </section>

    <section class="card" id="recCard" aria-labelledby="h-recs">
      <div class="card-head">
        <h2 id="h-recs" data-i18n="step3">3. 推薦圖種</h2>
        <label class="toggle"><input type="checkbox" id="showAll"> <span data-i18n="showAll">顯示全部圖種</span></label>
      </div>
      <div id="shapeHints" class="hints"></div>
      <p id="recCount" class="muted"></p>
      <ol id="recList" class="rec-list"></ol>
    </section>
  </div>

  <div class="col-right">
    <section class="card" id="chartCard" aria-labelledby="h-chart">
      <h2 id="h-chart" data-i18n="step4">4. 圖表</h2>
      <div id="chartHead"></div>
      <div id="rendererTabs" class="tabs" role="tablist"></div>
      <div id="controls" class="controls"></div>
      <div id="chartHost" class="chart-host"></div>
    </section>

    <section class="card" id="tutCard" aria-labelledby="h-tut">
      <h2 id="h-tut" data-i18n="step5">5. 教學</h2>
      <div id="tutMeta" class="muted"></div>
      <article id="tutorial" class="markdown"></article>
    </section>
  </div>
</main>

<footer class="site-footer">
  <p data-i18n="footer"></p>
  <p><a href="https://github.com/g0uv4/what-is-the-data-saying/issues/new?template=chart-request.yml" target="_blank" rel="noopener noreferrer" data-i18n="chartRequest">想要新圖種？到 GitHub 提出圖表請求</a></p>
</footer>

<!-- Plain scripts (no ES modules) so the page works from file:// -->
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="data/content.js"></script>
<script src="data/samples.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/entitlement.js"></script>
<script src="js/i18n.js"></script>
<script src="js/csv.js"></script>
<script src="js/input.js"></script>
<script src="js/types.js"></script>
<script src="js/rules.js"></script>
<script src="js/markdown.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
